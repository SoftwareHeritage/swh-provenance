[workspace]

resolver = "2"

members = [
    "db-build",
    "rust",
]

[workspace.package]
version = "0.5.0"
license = "GPL-3.0-or-later"
repository = "https://gitlab.softwareheritage.org/swh/devel/swh-provenance"

[workspace.dependencies]
dsi-progress-logger = "0.8.0"
swh-graph = ">= 13.0.0, <14"
swh-graph-stdlib = ">= 15.0.0, < 16"
swh-provenance-db-build = { path = "db-build/", version = "0.5.0" }

# Database
ar_row = ">=1.1.0, <3"
ar_row_derive = ">=1.1.0, <3"
arrow = { version = ">=55.0.0, <59", default-features = false }
dataset-writer = { version = ">=1.1.1, <3", features = ["parquet"] }
object_store = { version = ">=0.12.0, <0.14", default-features = false, features = ["fs"] }
parquet_aramid = "0.4.0"
parquet = { version = ">=55.0.0, <59", default-features = false }

# Elias-Fano index
epserde = "0.13.0"
sux = "0.15.0"
value-traits = "0.3.0"


[profile.dev]
debug = "limited"         # Save space

[profile.release]
lto = "thin"              # Fat LTO takes minutes
debug = "limited"         # Include profiling info.
