[package]
name = "swh-provenance-db-build"
description = "Reads a swh-graph dataset, and produces a Parquet database suitable for efficient provenance queries"
repository.workspace = true
version.workspace = true
edition = "2021"
license.workspace = true
keywords = ["software-heritage", "graph", "provenance", "grpc"]
categories = ["compression", "science"]
rust-version = "1.82"

[dependencies]
anyhow = {version="1.0.71", features=["backtrace"]}
bytemuck = { version = "1.14.0", features = ["extern_crate_alloc"] }
byteorder = "1.4.3"
chrono = { version = "0.4.31", features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }
swh-graph = { workspace = true, features = ["serde"] }
swh-graph-stdlib = { workspace = true }

# CLI & logging
clap = { version = "4.1.6", features = ["derive"] }
dsi-progress-logger.workspace = true
env_logger = "0.11.5"
log = "0.4.17"

# Database
ar_row.workspace = true
ar_row_derive.workspace = true
arrow.workspace = true
dataset-writer.workspace = true
parquet = { workspace = true, features = ["arrow", "zstd"] }

# Data structures
dashmap = "6.1.0"
rapidhash = "4.4.2"
sux.workspace = true
value-traits.workspace = true

# Parallelism
rayon = "1.9.0"
rdst = { version  ="0.20.14" }

# serde
csv = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.14"

[dev-dependencies]
pretty_assertions = "1.4.0"

[[bin]]
name = "find-earliest-revision"
